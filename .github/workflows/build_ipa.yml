on:
push:
branches: [ "main", "master" ]
workflow_dispatch:
jobs:
build-ios-ipa:
runs-on: macos-14 # Бесплатный облачный Mac от GitHub с установленным Xcode
steps:
- name: 1. Скачивание твоего Swift-кода
uses: actions/checkout@v4
- name: 2. Подготовка структуры проекта и включение 120Hz ProMotion (iPhone 14 Pro)
run: |
mkdir -p Sources
# Перемещаем наш Swift-файл в папку исходников
if [ -f "ColdCallLiquidCRM.swift" ]; then
cp ColdCallLiquidCRM.swift Sources/ColdCallLiquidCRM.swift
fi
# Создаем Info.plist с принудительным анлоком 120Hz ProMotion для iPhone 14 Pro
cat << 'EOF' > Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
<key>CFBundleDevelopmentRegion</key>
<string>ru</string>
<key>CFBundleDisplayName</key>
<string>ColdCall CRM</string>
<key>CFBundleExecutable</key>
<string>\bm{(EXECUTABLE_NAME)</string>}
\bm{<key>CFBundleIdentifier</key>}
\bm{<string>}(PRODUCT_BUNDLE_IDENTIFIER)</string>
<key>CFBundleInfoDictionaryVersion</key>
<string>6.0</string>
<key>CFBundleName</key>
<string>$(PRODUCT_NAME)</string>
<key>CFBundlePackageType</key>
<string>APPL</string>
<key>CFBundleShortVersionString</key>
<string>1.0</string>
<key>CFBundleVersion</key>
<string>1</string>
<key>LSRequiresIPhoneOS</key>
<true/>
<key>CADisableMinimumFrameDurationOnPhone</key>
<true/>
<key>UIApplicationSceneManifest</key>
<dict>
<key>UIApplicationSupportsMultipleScenes</key>
<false/>
</dict>
<key>UILaunchScreen</key>
<dict>
<key>UIColorName</key>
<string>LaunchBackground</string>
</dict>
<key>UISupportedInterfaceOrientations</key>
<array>
<string>UIInterfaceOrientationPortrait</string>
</array>
<key>UIUserInterfaceStyle</key>
<string>Dark</string>
</dict>
</plist>
EOF
# Создаем конфигурацию XcodeGen для автоматической генерации проекта Xcode
cat << 'EOF' > project.yml
name: ColdCallPro
options:
bundleIdPrefix: com.personal
deploymentTarget:
iOS: "16.0"
targets:
ColdCallPro:
type: application
platform: iOS
sources:
- Sources
info:
path: Info.plist
settings:
PRODUCT_BUNDLE_IDENTIFIER: com.personal.coldcallpro.crm
MARKETING_VERSION: "1.0.0"
CURRENT_PROJECT_VERSION: "1"
SWIFT_VERSION: "5.9"
TARGETED_DEVICE_FAMILY: "1"
GENERATE_INFOPLIST_FILE: NO
EOF
- name: 3. Генерация Xcode-проекта через XcodeGen
run: |
if ! command -v xcodegen &> /dev/null; then
brew install xcodegen
fi
xcodegen generate
- name: 4. Компиляция нативного приложения под процессор Apple A16 Bionic (arm64)
run: |
xcodebuild build 
-project ColdCallPro.xcodeproj 
-scheme ColdCallPro 
-configuration Release 
-sdk iphoneos 
-derivedDataPath build_output 
CODE_SIGN_IDENTITY="" 
CODE_SIGNING_REQUIRED=NO 
CODE_SIGNING_ALLOWED=NO
- name: 5. Упаковка в готовый файл ColdCallPro.ipa
run: |
mkdir -p Payload
cp -r build_output/Build/Products/Release-iphoneos/ColdCallPro.app Payload/
zip -r9 ColdCallPro.ipa Payload
- name: 6. Выгрузка готового .ipa файла для скачивания на Windows
uses: actions/upload-artifact@v4
with:
name: ColdCallPro-iPhone14Pro-IPA
path: ColdCallPro.ipa
if-no-files-found: error
