{"name":"Build ColdCallPro IPA","on":{"push":{"branches":["main","master"]},"workflow_dispatch":{}},"jobs":{"build":{"runs-on":"macos-latest","steps":[{"name":"Checkout code","uses":"actions/checkout@v4"},{"name":"Build and Package IPA","run":"mkdir -p Sources && SWIFT_FILE=(find . -maxdepth 2 -name '*.swift' \vert{} head -n 1) && if [ -z \"$SWIFT_FILE\" ]; then echo 'Swift file not found'; exit 1; fi && grep -v '```' \"$SWIFT_FILE\" > Sources/ColdCallLiquidCRM.swift && plutil -create xml1 Info.plist && plutil -insert CFBundleDevelopmentRegion -string ru Info.plist && plutil -insert CFBundleDisplayName -string 'ColdCall CRM' Info.plist && plutil -insert CFBundleExecutable -string '$(EXECUTABLE_NAME)' Info.plist && plutil -insert CFBundleIdentifier -string '$(PRODUCT_BUNDLE_IDENTIFIER)' Info.plist && plutil -insert CFBundleInfoDictionaryVersion -string '6.0' Info.plist && plutil -insert CFBundleName -string '(PRODUCT_NAME)' Info.plist && plutil -insert CFBundlePackageType -string APPL Info.plist && plutil -insert CFBundleShortVersionString -string '1.0' Info.plist && plutil -insert CFBundleVersion -string '1' Info.plist && plutil -insert LSRequiresIPhoneOS -bool YES Info.plist && plutil -insert CADisableMinimumFrameDurationOnPhone -bool YES Info.plist && plutil -insert UIUserInterfaceStyle -string Dark Info.plist && plutil -insert UILaunchScreen -dictionary Info.plist && plutil -insert UIApplicationSceneManifest -xml '<dict><key>UIApplicationSupportsMultipleScenes</key><false/></dict>' Info.plist && plutil -insert UISupportedInterfaceOrientations -xml '<array><string>UIInterfaceOrientationPortrait</string></array>' Info.plist && echo 'name: ColdCallPro' > project.yml && echo 'options:' >> project.yml && echo '  bundleIdPrefix: com.personal' >> project.yml && echo '  deploymentTarget:' >> project.yml && echo '    iOS: "16.0"' >> project.yml && echo 'targets:' >> project.yml && echo '  ColdCallPro:' >> project.yml && echo '    type: application' >> project.yml && echo '    platform: iOS' >> project.yml && echo '    sources: [Sources]' >> project.yml && echo '    info:' >> project.yml && echo '      path: Info.plist' >> project.yml && echo '    settings:' >> project.yml && echo '      PRODUCT_BUNDLE_IDENTIFIER: com.personal.coldcallpro.crm' >> project.yml && echo '      MARKETING_VERSION: "1.0.0"' >> project.yml && echo '      CURRENT_PROJECT_VERSION: "1"' >> project.yml && echo '      SWIFT_VERSION: "5.9"' >> project.yml && echo '      TARGETED_DEVICE_FAMILY: "1"' >> project.yml && echo '      GENERATE_INFOPLIST_FILE: NO' >> project.yml && (command -v xcodegen >/dev/null 2>&1 || brew install xcodegen) && xcodegen generate && xcodebuild build -project ColdCallPro.xcodeproj -scheme ColdCallPro -configuration Release -sdk iphoneos -derivedDataPath build_output CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO && mkdir -p Payload && cp -r build_output/Build/Products/Release-iphoneos/ColdCallPro.app Payload/ && zip -r9 ColdCallPro.ipa Payload"},{"name":"Upload IPA Artifact","uses":"actions/upload-artifact@v4","with":{"name":"ColdCallPro-iPhone14Pro-IPA","path":"ColdCallPro.ipa","if-no-files-found":"error"}}]}}}
